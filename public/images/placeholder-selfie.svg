<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="selfieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="200" height="200" rx="28" fill="url(#selfieBg)"/>
  <rect x="2" y="2" width="196" height="196" rx="26" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Face/Selfie Outline -->
  <circle cx="100" cy="78" r="34" fill="url(#avatarGrad)" />
  <path d="M50 152 C 50 114, 150 114, 150 152 Z" fill="url(#avatarGrad)" opacity="0.9" />
  
  <!-- Camera badge in corner -->
  <circle cx="145" cy="145" r="22" fill="#0f172a" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="145" cy="145" r="14" fill="#3b82f6" />
  <circle cx="145" cy="145" r="5" fill="#ffffff" />
  <circle cx="148" cy="142" r="2" fill="#93c5fd" />
</svg>
